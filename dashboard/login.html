<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchiCheck 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body data-page="login">
  <main class="login-wrap">
    <form class="card login-card" id="login-form" novalidate>
      <div class="logo"><span class="logo-mark" aria-hidden="true"></span>ArchiCheck</div>
      <div class="login-head">
        <h1>대시보드 접속</h1>
        <p class="muted">팀에서 정한 대시보드 비밀번호를 입력하세요.</p>
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password">비밀번호</label>
          <button type="button" class="link-btn" id="toggle-pw" aria-controls="password">보기</button>
        </div>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus spellcheck="false">
        <p class="field-error" id="pw-error" role="alert"></p>
      </div>

      <button type="submit" class="btn primary" id="login-btn">접속하기</button>
      <p class="login-note" id="login-note"></p>
    </form>
  </main>

  <script src="sample-data.js"></script>
  <script src="app.js?v=11"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · ArchiCheck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='2' fill='none' stroke='%230969da' stroke-width='1.6'/%3E%3Cpath d='M6 1v14M6 8h9' stroke='%230969da' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=19">
  <link rel="stylesheet" href="login.css?v=1">
</head>
<body data-page="login">
  <main class="login-page">
    <!-- 오른쪽: 로그인 카드 + 이용 순서 (DOM 앞쪽이라 Tab이 비밀번호 칸부터 시작) -->
    <aside class="login-side">
      <form class="card login-card" id="login-form" aria-label="대시보드 로그인" novalidate>
        <div class="login-card-top">
          <div class="logo"><span class="logo-mark" aria-hidden="true"></span>ArchiCheck</div>
          <button class="theme-btn" id="theme-btn" type="button">테마 전환</button>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="pw-box">
            <input id="password" name="password" type="password" autocomplete="current-password" autofocus spellcheck="false" aria-describedby="pw-error caps-note">
            <button type="button" class="pw-eye" id="toggle-pw" aria-controls="password" aria-pressed="false" aria-label="비밀번호 보기" title="비밀번호 보기">
              <svg class="eye-shut" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9c2.5 3.8 5.7 5.7 9.5 5.7s7-1.9 9.5-5.7"/><path d="M5.6 12.6 3.6 15.4M12 14.7v3.4M18.4 12.6l2 2.8"/></svg>
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="caps-note" id="caps-note" hidden>Caps Lock이 켜져 있습니다.</p>
          <p class="field-error" id="pw-error" role="alert"></p>
        </div>

        <button type="submit" class="btn primary" id="login-btn">접속하기</button>
        <p class="login-note" id="login-note"></p>
      </form>

      <section class="card login-guide" aria-label="이용 순서 (단계를 누르면 예시가 그 장면으로 이동)">
        <ol class="guide-steps" id="demo-steps">
          <li data-step="1"><button type="button" class="guide-step" data-jump="1"><b>1</b><div><strong>분석 이력</strong><span>PR을 올리면 자동으로 분석을 시작합니다.</span></div></button></li>
          <li data-step="2"><button type="button" class="guide-step" data-jump="2"><b>2</b><div><strong>불일치 확인</strong><span>설계 문서와 코드가 어긋난 곳을 나란히 보여 줍니다.</span></div></button></li>
          <li data-step="3"><button type="button" class="guide-step" data-jump="3"><b>3</b><div><strong>수정안 받기</strong><span>코드를 고칠지, 문서를 고칠지 고르면 수정안을 만들어 줍니다.</span></div></button></li>
          <li data-step="4"><button type="button" class="guide-step" data-jump="4"><b>4</b><div><strong>조치 완료</strong><span>모든 불일치의 방향을 정하면 완료로 표시됩니다.</span></div></button></li>
        </ol>
        <p class="guide-note">예시 데이터 · 실제 결과는 로그인 후 확인</p>
      </section>
    </aside>

    <!-- 왼쪽: 예시 화면. 가상 저장소 데이터라 로그인 전에 보여도 된다. 누를 수 없게 inert -->
    <section class="demo-area">
      <h1 class="demo-title">PR을 올리면, 설계 문서와 <em>어긋난 곳</em>을 찾아 고칠 방법까지 보여 드립니다</h1>
      <div class="demo-window" inert aria-hidden="true">
        <div class="demo-bar"><i></i><i></i><i></i><span class="demo-url" id="demo-url">/dashboard/</span><span class="demo-tag">예시 화면</span></div>
        <div class="demo-body" id="demo-body"></div>
      </div>
    </section>
  </main>

  <script src="sample-data.js"></script>
  <script src="fix-panel.js?v=1"></script>
  <script src="app.js?v=19"></script>
  <script src="login-demo.js?v=1"></script>
</body>
</html>
